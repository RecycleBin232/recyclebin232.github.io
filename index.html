<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>RecycleBin's Repo</title>

<style>
body {
    margin:0;
    padding-top:70px;
    text-align:center;
    font-family:Helvetica, Arial, sans-serif;
    color:white;
    min-height:100vh;

    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,.08),
            transparent 40%,
            rgba(0,0,0,.15)
        ),
        repeating-linear-gradient(
            0deg,
            rgba(255,255,255,.06) 0px,
            rgba(255,255,255,.06) 1px,
            transparent 1px,
            transparent 3px
        ),
        repeating-linear-gradient(
            90deg,
            rgba(0,0,0,.08) 0px,
            rgba(0,0,0,.08) 1px,
            transparent 1px,
            transparent 3px
        ),
        #3b3b3b;
}

body::before {
    content:"";
    position:fixed;
    inset:0;

    background:
        radial-gradient(
            circle,
            rgba(255,255,255,.08) 0,
            transparent 1px
        );

    background-size:4px 4px;

    pointer-events:none;
}

h1 {
    font-size:34px;
    color:#eee;

    text-shadow:
        0 2px 0 #000,
        0 4px 8px rgba(0,0,0,.8);

    font-weight:bold;
}

.repo {
    margin:40px auto;

    width:320px;

    padding:30px 20px;

    border-radius:18px;

    background:
        linear-gradient(
            135deg,
            #555,
            #222
        );

    box-shadow:
        inset 0 1px 0 rgba(255,255,255,.2),
        0 8px 20px rgba(0,0,0,.8);
}

.add img {
    width:220px;
    margin-top:20px;

    filter:
        drop-shadow(
        0 5px 5px rgba(0,0,0,.8)
        );
}
</style>

</head>

<body>

<div class="repo">

<h1>RecycleBin's Repo</h1>

<a class="add"
href="cydia://url/https://cydia.saurik.com/api/share#?source=https://recyclebin232.github.io">

<img src="cydia.png" alt="Add to Cydia">

</a>

</div>

</body>
</html>
